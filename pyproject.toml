[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mjx-deploy"
version = "0.1.0"
description = "Standalone AHAC Go2 policy deployment package for MJX/Open-DiffLoco policies."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["python"]

